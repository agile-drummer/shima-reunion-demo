<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個別回答リンク｜デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#25352f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0}.top a{color:#39705b;font-weight:800}.card,.stat{background:#fff;border:1px solid #e4ded1;border-radius:16px}.card{padding:15px;margin-top:12px}.note{color:#6f7b75;font-size:13px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.stat{padding:10px 5px;text-align:center}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:#6f7b75}.person{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.person h2{margin:0;font-size:17px}.meta{font-size:12px;color:#6f7b75;margin-top:4px}.pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#fff0df;color:#9a571e}.issue{border:0;border-radius:10px;padding:11px 13px;background:#39705b;color:#fff;font-weight:800}.result{grid-column:1/-1;padding:12px;border-radius:12px;background:#eff6f2}.result[hidden]{display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.actions a,.actions button{padding:10px;border-radius:9px;text-align:center;text-decoration:none;border:0;font-weight:800}.line{background:#06c755;color:#fff}.open{background:#fff;color:#39705b;border:1px solid #e4ded1!important}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.person{grid-template-columns:1fr}.issue{width:100%}}</style></head><body><main class="wrap"><header class="top"><div><h1>個別回答リンク</h1><p class="note">公開デモ・架空データだけで、声かけ後の進捗を再現します。</p></div><a href="../">← ダッシュボード</a></header><section class="stats"><div class="stat"><strong id="uncontacted">0</strong><span>未連絡</span></div><div class="stat"><strong id="invited">0</strong><span>招待済</span></div><div class="stat"><strong id="opened">0</strong><span>開封済</span></div><div class="stat"><strong id="answered">0</strong><span>回答済</span></div></section><article class="card person"><div><h2>モコ リス</h2><div class="meta">3組 ／ どんぐり小 ／ コンタ担当</div><span id="progress" class="pill"></span></div><button id="issue" class="issue" type="button">回答リンクを作る</button><div id="result" class="result" hidden></div></article></main><script>const INVITE_KEY='atsumare-demo-participant-invite',ANSWER_KEY='atsumare-shimachu-demo',PERSON_ID='demo-invite-moko';const progress=document.getElementById('progress'),result=document.getElementById('result'),issue=document.getElementById('issue');function answers(){try{return JSON.parse(localStorage.getItem(ANSWER_KEY)||'[]')}catch{return[]}}function invite(){try{return JSON.parse(localStorage.getItem(INVITE_KEY)||'null')}catch{return null}}function status(){if(answers().some(row=>row.id===PERSON_ID&&row.intent&&row.intent!=='未回答'))return'回答済';const i=invite();if(i?.status==='opened')return'開封済';if(i?.status==='invited')return'招待済';return'未連絡'}function render(){const s=status();progress.textContent=s;uncontacted.textContent=s==='未連絡'?1:0;invited.textContent=s==='招待済'?1:0;opened.textContent=s==='開封済'?1:0;answered.textContent=s==='回答済'?1:0;issue.disabled=s==='回答済';issue.textContent=s==='招待済'||s==='開封済'?'リンクを再発行':'回答リンクを作る'}issue.onclick=()=>{const token='demo-participant-invite-'+Date.now();localStorage.setItem(INVITE_KEY,JSON.stringify({token,status:'invited'}));const url=new URL('/respond/',location.origin);url.searchParams.set('token',token);result.hidden=false;result.innerHTML=`<strong>回答リンクを作成しました</strong><div class="actions"><a class="line" href="https://line.me/R/msg/text/?${encodeURIComponent('同窓会の回答はこちら '+url)}">LINEで送る</a><a id="openInvite" class="open" href="${url}">デモではリンクを開く</a></div>`;render()};render();</script></body></html>

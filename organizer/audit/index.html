<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営履歴｜あつまれ島中学校</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#25352f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 48px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0;font-size:23px}.back{color:#39705b;font-weight:800}.summary,.card{background:#fff;border:1px solid #e4ded1;border-radius:16px;box-shadow:0 6px 22px #4d44380d}.summary{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;padding:14px}.summary strong{font-size:18px}.meta,.time{font-size:12px;color:#6f7b75;line-height:1.7}.count{display:grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:#b45b4f;color:#fff;font-weight:900}.card{padding:14px;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:900}.status{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.status.unconfirmed{background:#fee8e1;color:#a33c2d}.status.confirmed{background:#e4f4e9;color:#147443}.change{margin-top:8px;font-size:15px;font-weight:850}.arrow{padding:0 6px;color:#6f7b75}.confirm{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:#39705b;color:#fff;font-weight:800}.empty{text-align:center;color:#6f7b75;padding:24px}</style></head><body><main class="wrap"><header class="top"><h1>運営履歴</h1><a class="back" href="../">← ダッシュボード</a></header><section class="summary"><div><strong>最近の回答変更</strong><div class="meta">すべて架空データです</div></div><span id="unconfirmedCount" class="count"></span></section><section id="list"></section></main><script>const KEY='atsumare-response-change-history';const seed=[{id:'demo-1',name:'モコ リス',className:'3組',before:'参加したい',after:'今回は欠席予定',changedAt:'8/8 17:10',assignee:'コンタ',confirmed:false},{id:'demo-2',name:'ペンタ ネコ',className:'3組',before:'まだわからない',after:'参加したい',changedAt:'8/8 16:42',assignee:'コンタ',confirmed:true,confirmedAt:'8/8 16:50',confirmedBy:'コンタ'}];let items=JSON.parse(localStorage.getItem(KEY)||'null')||seed;const mask=name=>name.split(' ').map(x=>x.slice(0,1)+'＊'.repeat(Math.max(1,x.length-1))).join(' ');function save(){localStorage.setItem(KEY,JSON.stringify(items))}function render(){unconfirmedCount.textContent=items.filter(x=>!x.confirmed).length;list.innerHTML=items.length?items.map(x=>`<article class="card"><div class="head"><div><div class="name">${mask(x.name)} <span class="meta">${x.className}</span></div><div class="time">${x.changedAt}</div></div><span class="status ${x.confirmed?'confirmed':'unconfirmed'}">${x.confirmed?'確認済み':'未確認'}</span></div><div class="change">${x.before}<span class="arrow">→</span>${x.after}</div><div class="meta">担当：${x.assignee}</div>${x.confirmed?`<div class="meta">${x.confirmedBy} が ${x.confirmedAt} に確認</div>`:`<button class="confirm" data-id="${x.id}">確認済みにする</button>`}</article>`).join(''):'<div class="card empty">回答変更はまだありません。</div>';document.querySelectorAll('.confirm').forEach(button=>button.onclick=()=>{items=items.map(x=>x.id===button.dataset.id?{...x,confirmed:true,confirmedAt:'たった今',confirmedBy:'コンタ'}:x);save();render()})}render();</script></body></html>

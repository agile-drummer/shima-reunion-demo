<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>運営メンバーデモ｜あつまれ島中学校</title>
<style>
:root{--navy:#173f50;--green:#06c755;--bg:#f3f7f6;--muted:#64777d;--line:#dce8e5;--orange:#d9782d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--navy)}button,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{font-size:24px;margin:3px 0}.eyebrow{font-size:12px;color:var(--muted);margin:0}.link{color:#087f8c;font-size:13px}.card{background:#fff;border-radius:18px;padding:17px;box-shadow:0 8px 28px rgba(0,0,0,.06);margin-bottom:14px}.hidden{display:none!important}.note{color:var(--muted);line-height:1.7;font-size:14px}.demo-note{background:#fff8e8;border:1px solid #f1ddb0}.linebtn{width:100%;border:0;padding:14px 16px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.user{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:#e9f4f1;padding:6px 10px;border-radius:999px;font-size:12px}.progress-title{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.bar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:#e8eeee}.bar span{height:100%}.want{background:#218c74}.maybe{background:#6bb7a5}.no{background:#97a7ad}.unanswered{background:#d9782d}.legend{display:flex;gap:8px 12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 9px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 12px;border-radius:999px;font-weight:700}.filter.active{background:var(--navy);color:#fff}.count{font-size:13px;color:var(--muted);margin:8px 0}.person{background:#fff;border-radius:15px;padding:15px;margin-top:10px;border:1px solid #edf2f1}.person.answered{background:#e7eaeb}.person h3{margin:0;font-size:17px}.meta{font-size:13px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#edf2f3}.tag.line{background:#dff7e8;color:#08753c}.controls{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;margin-top:10px}.controls strong{font-size:14px}select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--navy);font-weight:700}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-weight:800;color:var(--navy)}.seg button.active{background:var(--navy);color:#fff}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px}.logout{border:0;background:none;color:#087f8c;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><p class="eyebrow">公開デモ・架空データ</p><h1>連絡ダッシュボード</h1></div><a class="link" href="../">公開サイト</a></header>
<section class="card demo-note note">これは操作体験用のデモです。LINEログイン、友だち追加、名簿、回答、担当者はすべて架空で、データはこのブラウザ内だけに保存されます。</section>
<section id="login" class="card"><p class="note">本番では承認済みの幹事・サポーターだけがLINEログインできます。</p><button id="loginBtn" class="linebtn">LINEでログイン（デモ）</button></section>
<div id="dashboard" class="hidden">
<section class="card user"><div><strong>コンタ さん</strong><div class="meta">デモ管理者</div></div><div><span class="badge">幹事</span> <button id="logoutBtn" class="logout">ログアウト</button></div></section>
<section class="card"><div class="progress-title"><span>参加意向</span><small id="total"></small></div><div id="bar" class="bar"></div><div id="legend" class="legend"></div></section>
<section class="card"><div class="filters"><button class="filter active" data-axis="assignment" data-value="mine">自分の担当</button><button class="filter active" data-axis="assignment" data-value="unassigned">担当未設定</button><button class="filter active" data-axis="response" data-value="unanswered">未回答</button><button class="filter active" data-axis="response" data-value="answered">回答済み</button></div><div class="filters"><button class="filter" data-school="どんぐり小">どんぐり</button><button class="filter" data-school="しおかぜ小">しおかぜ</button><button class="filter" data-school="こもれび小">こもれび</button></div><div id="count" class="count"></div><div id="list"></div></section>
</div>
</main><div id="toast" class="toast hidden"></div>
<script>
const KEY='atsumare-shimachu-organizer-demo';
const seed=[
{id:'D001',name:'モ＊ リ＊',school:'どんぐり小',className:'1組',assignee:'コンタ',attendance:'参加したい',contact:'済',line:true},
{id:'D002',name:'ペ＊＊ ペ＊＊＊',school:'しおかぜ小',className:'2組',assignee:'コンタ',attendance:'未回答',contact:'済',line:false},
{id:'D003',name:'コ＊ キ＊＊',school:'こもれび小',className:'3組',assignee:'',attendance:'都合が合えば参加したい',contact:'済',line:true},
{id:'D004',name:'ミ＊ ウ＊＊',school:'どんぐり小',className:'1組',assignee:'',attendance:'未回答',contact:'未',line:false},
{id:'D005',name:'ク＊＊ ク＊',school:'しおかぜ小',className:'2組',assignee:'モコ',attendance:'今回は欠席予定',contact:'済',line:false},
{id:'D006',name:'ナ＊ ネ＊',school:'こもれび小',className:'3組',assignee:'コンタ',attendance:'未回答',contact:'未',line:false}
];
let items=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let logged=localStorage.getItem(KEY+'-login')==='1';
const filters={assignment:new Set(['mine','unassigned']),response:new Set(['unanswered','answered']),school:new Set()};
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));const toast=m=>{const el=document.querySelector('#toast');el.textContent=m;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1500)};
function show(){document.querySelector('#login').classList.toggle('hidden',logged);document.querySelector('#dashboard').classList.toggle('hidden',!logged);if(logged)render()}
function renderSummary(){const total=items.length,c={want:0,maybe:0,no:0,unanswered:0};items.forEach(x=>{if(x.attendance==='参加したい')c.want++;else if(x.attendance==='都合が合えば参加したい')c.maybe++;else if(x.attendance==='今回は欠席予定')c.no++;else c.unanswered++});document.querySelector('#total').textContent=`全${total}人`;document.querySelector('#bar').innerHTML=`<span class="want" style="width:${c.want/total*100}%"></span><span class="maybe" style="width:${c.maybe/total*100}%"></span><span class="no" style="width:${c.no/total*100}%"></span><span class="unanswered" style="width:${c.unanswered/total*100}%"></span>`;document.querySelector('#legend').textContent=`参加したい ${c.want}人　都合が合えば ${c.maybe}人　欠席 ${c.no}人　未回答 ${c.unanswered}人`}
function filtered(){let out=[...items];const a=filters.assignment,r=filters.response;if(a.size===1)out=out.filter(x=>a.has('mine')?x.assignee==='コンタ':!x.assignee);if(r.size===1)out=out.filter(x=>r.has('answered')?x.attendance!=='未回答':x.attendance==='未回答');if(filters.school.size)out=out.filter(x=>filters.school.has(x.school));return out}
function render(){renderSummary();const out=filtered();document.querySelector('#count').textContent=`${out.length}人を表示`;document.querySelector('#list').innerHTML=out.map(x=>`<article class="person ${x.attendance!=='未回答'?'answered':''}"><h3>${x.name}</h3><div class="meta">${x.className} ／ ${x.school}</div><div class="tags">${x.line?'<span class="tag line">公式LINE友だち</span>':''}<span class="tag">${x.attendance==='未回答'?'未回答':'回答済み'}</span></div><div class="controls"><strong>担当</strong><select data-id="${x.id}" data-field="assignee"><option value="">未選択</option><option ${x.assignee==='コンタ'?'selected':''}>コンタ</option><option ${x.assignee==='モコ'?'selected':''}>モコ</option><option ${x.assignee==='ペンタ'?'selected':''}>ペンタ</option></select><strong>参加状況</strong><select data-id="${x.id}" data-field="attendance">${['未回答','参加したい','都合が合えば参加したい','今回は欠席予定'].map(v=>`<option ${x.attendance===v?'selected':''}>${v}</option>`).join('')}</select><strong>連絡状況</strong><div class="seg"><button data-id="${x.id}" data-contact="未" class="${x.contact==='未'?'active':''}">未連絡</button><button data-id="${x.id}" data-contact="済" class="${x.contact==='済'?'active':''}">連絡済み</button></div></div></article>`).join('')||'<p class="note">該当する人はいません。</p>';
document.querySelectorAll('select[data-id]').forEach(el=>el.onchange=()=>{const x=items.find(i=>i.id===el.dataset.id);x[el.dataset.field]=el.value;if(el.dataset.field==='attendance'&&el.value!=='未回答')x.contact='済';save();render();toast('更新しました')});document.querySelectorAll('button[data-contact]').forEach(el=>el.onclick=()=>{items.find(i=>i.id===el.dataset.id).contact=el.dataset.contact;save();render();toast('更新しました')})}
document.querySelector('#loginBtn').onclick=()=>{logged=true;localStorage.setItem(KEY+'-login','1');show()};document.querySelector('#logoutBtn').onclick=()=>{logged=false;localStorage.removeItem(KEY+'-login');show()};
document.querySelectorAll('.filter[data-axis]').forEach(btn=>btn.onclick=()=>{const set=filters[btn.dataset.axis],v=btn.dataset.value;if(set.has(v)){set.delete(v);btn.classList.remove('active')}else{set.add(v);btn.classList.add('active')}if(!set.size){document.querySelectorAll(`[data-axis="${btn.dataset.axis}"]`).forEach(b=>{set.add(b.dataset.value);b.classList.add('active')})}render()});document.querySelectorAll('.filter[data-school]').forEach(btn=>btn.onclick=()=>{const v=btn.dataset.school;if(filters.school.has(v)){filters.school.delete(v);btn.classList.remove('active')}else{filters.school.add(v);btn.classList.add('active')}render()});show();
</script>
</body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>運営メンバーデモ｜あつまれ島中学校</title>
<style>
:root{--navy:#173f50;--green:#06c755;--bg:#f3f7f6;--muted:#64777d;--line:#dce8e5;--orange:#d9782d;--danger:#a9433a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--navy)}button,select{font:inherit}.wrap{max-width:860px;margin:auto;padding:20px 14px 50px}.top,.user,.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:24px;margin:3px 0}.eyebrow{font-size:12px;color:var(--muted);margin:0}.link,.logout{color:#087f8c;font-size:13px}.card{background:#fff;border-radius:18px;padding:17px;box-shadow:0 8px 28px #0000000f;margin-bottom:14px}.hidden{display:none!important}.note{color:var(--muted);line-height:1.7;font-size:14px}.demo-note{background:#fff8e8;border:1px solid #f1ddb0}.linebtn{display:block;width:100%;border:0;padding:14px 16px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;text-align:center;text-decoration:none}.badge,.id-badge{display:inline-block;background:#e9f4f1;padding:5px 9px;border-radius:999px;font-size:12px}.id-badge{background:#edf2f3;color:#52666b;font-family:ui-monospace,monospace}.role-switch,.filters,.tags{display:flex;gap:7px;flex-wrap:wrap}.role-switch{margin-top:12px}.role-switch button,.filter,.action{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 11px;border-radius:999px;font-weight:700}.role-switch button.active,.filter.active{background:var(--navy);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{padding:12px;background:#fff;border-radius:12px}.stat strong{display:block;font-size:22px}.bar{display:flex;height:20px;border-radius:999px;overflow:hidden;background:#e8eeee;margin:10px 0}.bar span{height:100%}.want{background:#218c74}.maybe{background:#6bb7a5}.no{background:#97a7ad}.unanswered{background:#d9782d}.breakdown,.count,.meta{font-size:13px;color:var(--muted)}.filters{overflow:auto;padding:2px 0 9px}.person,.application{background:#fff;border-radius:15px;padding:15px;margin-top:10px;border:1px solid #edf2f1}.person.answered{background:#e7eaeb}.person.deceased{background:#f5f1f1;border-color:#dfcece}.person h3,.application h3{margin:0;font-size:17px}.tags{margin-top:8px}.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#edf2f3}.tag.line{background:#dff7e8;color:#08753c}.tag.deceased{background:#efe0e0;color:#813b36}.controls{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--navy);font-weight:700}.action.danger{color:var(--danger);border-color:#ddb9b5}.readonly{padding:10px;background:#f4f8f7;border-radius:10px}.application-actions{display:flex;gap:8px;margin-top:12px}.application-actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800}.approve{background:#dff7e8;color:#08753c}.hold{background:#fff0d7;color:#8a5b00}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.user,.section-head{align-items:flex-start}.section-head{flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div><p class="eyebrow">公開デモ・架空100人</p><h1>連絡ダッシュボード</h1></div><a class="link" href="../">公開サイト</a></header>
<section class="card demo-note note">本番版の最新機能を、架空データとlocalStorageだけで体験できます。</section>
<section id="login" class="card"><p class="note">LINE風画面でロールを選び、リッチメニューの「メンバーログイン」を押してください。</p><a class="linebtn" href="../line/">LINE風トーク画面へ</a></section>
<div id="dashboard" class="hidden">
<section class="card user"><div><strong>コンタ さん</strong><div class="meta" id="roleDescription"></div><div class="role-switch"><button data-role="organizer">幹事</button><button data-role="supporter">サポーター</button><button data-role="member">一般</button></div></div><div><span id="roleBadge" class="badge"></span> <button id="logoutBtn" class="logout">ログアウト</button></div></section>
<section id="applications" class="card hidden"><div class="section-head"><div><p class="eyebrow">MEMBER APPLICATIONS</p><h2>メンバー申請</h2></div><span class="badge">2件</span></div><article class="application"><h3>ソラ イルカ</h3><div class="meta">LINE本人確認済み・招待ID DEMO-INV-01</div><div class="application-actions"><button class="approve">幹事で承認</button><button class="hold">保留</button></div></article><article class="application"><h3>リン コアラ</h3><div class="meta">公式LINE友だち確認済み</div><div class="application-actions"><button class="approve">サポーターで承認</button><button class="hold">保留</button></div></article></section>
<section class="stats"><div class="stat"><span>名簿</span><strong id="rosterCount">100</strong></div><div class="stat"><span>回答対象</span><strong id="eligibleCount"></strong></div><div class="stat"><span>回答済み</span><strong id="answeredCount"></strong></div><div class="stat"><span>逝去</span><strong id="deceasedCount"></strong></div></section>
<section class="card"><div class="section-head"><strong>参加意向</strong><small id="total"></small></div><div id="bar" class="bar"></div><div id="breakdown" class="breakdown"></div></section>
<section class="card"><div class="filters"><button class="filter active" data-class="">全クラス</button><button class="filter" data-class="1組">1組</button><button class="filter" data-class="2組">2組</button><button class="filter" data-class="3組">3組</button><button class="filter" data-class="4組">4組</button></div><div id="count" class="count"></div><div id="list"></div></section>
</div></main><div id="toast" class="hidden"></div>
<script>
const KEY='atsumare-shimachu-organizer-demo-v3',LOGIN='atsumare-shimachu-organizer-demo-v2-login',ROLE='atsumare-shimachu-organizer-demo-v2-role';
const surnames=['モコ','ペンタ','コンタ','ミミ','クルミ','ナギ','ソラ','リン','ポポ','タマ','ルル','ハル','ノア','ココ','ロロ','トト','フウ','マル','ベル','メイ','ララ','テト','ニコ','ピピ','レオ'],animals=['リス','ペンギン','キツネ','ウサギ','クマ','ネコ','イルカ','コアラ','ラッコ','パンダ','シカ','フクロウ','カモメ','ヤギ','ヒツジ','カワウソ','ハリネズミ','アザラシ','オオカミ','リャマ','トナカイ','ビーバー','モモンガ','フェネック','カピバラ'],schools=['どんぐり小','しおかぜ小','こもれび小'],people=['コンタ','モコ','ペンタ'];
const seed=Array.from({length:100},(_,i)=>({id:'D'+String(i+1).padStart(3,'0'),name:surnames[i%25]+' '+animals[(i+Math.floor(i/25)*7)%25],school:schools[i%3],className:(Math.floor(i/25)+1)+'組',assignee:i%4===0?'':people[i%3],attendance:['未回答','未回答','参加したい','都合が合えば参加したい','今回は欠席予定'][i%5],contact:i%3?'済':'未',officialLineConfirmed:i%4===0,deceased:[7,58].includes(i)}));
let items=JSON.parse(localStorage.getItem(KEY)||'null')||seed,logged=localStorage.getItem(LOGIN)==='1',role=localStorage.getItem(ROLE)||'member',classFilter='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));const canEdit=x=>role==='organizer'||(role==='supporter'&&x.assignee==='コンタ');
function summary(){const eligible=items.filter(x=>!x.deceased),c={want:0,maybe:0,no:0,unanswered:0};eligible.forEach(x=>{if(x.attendance==='参加したい')c.want++;else if(x.attendance.startsWith('都合'))c.maybe++;else if(x.attendance.startsWith('今回'))c.no++;else c.unanswered++});const answered=eligible.length-c.unanswered;document.querySelector('#eligibleCount').textContent=eligible.length;document.querySelector('#answeredCount').textContent=answered;document.querySelector('#deceasedCount').textContent=items.length-eligible.length;document.querySelector('#total').textContent='回答対象 '+eligible.length+'人';document.querySelector('#bar').innerHTML=Object.entries(c).map(([k,v])=>'<span class="'+k+'" style="width:'+(v/eligible.length*100)+'%"></span>').join('');document.querySelector('#breakdown').textContent='参加したい '+c.want+'人 ／ 予定が合えば '+c.maybe+'人 ／ むずかしそう '+c.no+'人 ／ 未回答 '+c.unanswered+'人'}
function render(){const names={organizer:'幹事',supporter:'サポーター',member:'一般メンバー'},desc={organizer:'全名簿・申請・逝去ステータスを管理できます',supporter:'自分の担当クラスを確認・更新できます',member:'名簿を閲覧できます（更新不可）'};document.querySelector('#roleBadge').textContent=names[role];document.querySelector('#roleDescription').textContent=desc[role];document.querySelector('#applications').classList.toggle('hidden',role!=='organizer');document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));summary();const out=items.filter(x=>(!classFilter||x.className===classFilter)&&(role==='organizer'||!x.deceased));document.querySelector('#count').textContent=out.length+'人を表示';document.querySelector('#list').innerHTML=out.map(x=>'<article class="person '+(x.deceased?'deceased':x.attendance!=='未回答'?'answered':'')+'"><h3>'+x.name+' <span class="id-badge">'+x.id+'</span></h3><div class="meta">'+x.className+' ／ '+x.school+'</div><div class="tags">'+(x.officialLineConfirmed?'<span class="tag line">公式LINE友だち</span>':'')+(x.deceased?'<span class="tag deceased">逝去（回答対象外）</span>':'<span class="tag">'+x.attendance+'</span>')+'</div>'+(canEdit(x)&&!x.deceased?'<div class="controls"><select aria-label="'+x.name+'の担当" data-id="'+x.id+'" data-field="assignee"><option value="">未設定</option>'+people.map(v=>'<option '+(x.assignee===v?'selected':'')+'>'+v+'</option>').join('')+'</select><select aria-label="'+x.name+'の参加状況" data-id="'+x.id+'" data-field="attendance">'+['未回答','参加したい','都合が合えば参加したい','今回は欠席予定'].map(v=>'<option '+(x.attendance===v?'selected':'')+'>'+v+'</option>').join('')+'</select>'+(role==='organizer'?'<button class="action danger" data-deceased="'+x.id+'">逝去（回答対象外）にする</button>':'')+'</div>':x.deceased&&role==='organizer'?'<button class="action" data-restore="'+x.id+'">回答対象に戻す</button>':'<p class="readonly">このロールでは閲覧のみです</p>')+'</article>').join('');document.querySelectorAll('select[data-id]').forEach(e=>e.onchange=()=>{items.find(x=>x.id===e.dataset.id)[e.dataset.field]=e.value;save();render()});document.querySelectorAll('[data-deceased]').forEach(b=>b.onclick=()=>{const x=items.find(i=>i.id===b.dataset.deceased);x.deceased=true;x.contact='不要';save();render()});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const x=items.find(i=>i.id===b.dataset.restore);x.deceased=false;x.contact='未';save();render()})}
function chooseClass(value){classFilter=value;document.querySelectorAll('[data-class]').forEach(x=>x.classList.toggle('active',x.dataset.class===value))}
function show(){document.querySelector('#login').classList.toggle('hidden',logged);document.querySelector('#dashboard').classList.toggle('hidden',!logged);if(logged){if(role==='supporter'&&!classFilter)chooseClass('1組');render()}}
document.querySelector('#logoutBtn').onclick=()=>{logged=false;localStorage.removeItem(LOGIN);show()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;localStorage.setItem(ROLE,role);chooseClass(role==='supporter'?'1組':'');render()});document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{chooseClass(b.dataset.class);render()});document.querySelectorAll('.application-actions button').forEach(b=>b.onclick=()=>b.closest('.application').remove());show();
</script></body></html>

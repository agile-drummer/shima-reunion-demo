<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>運営メンバーデモ｜あつまれ島中学校</title>
<style>
:root{--navy:#173f50;--green:#06c755;--bg:#f3f7f6;--muted:#64777d;--line:#dce8e5;--orange:#d9782d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--navy)}button,select{font:inherit}.wrap{max-width:820px;margin:auto;padding:20px 14px 50px}.top,.user{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:24px;margin:3px 0}.eyebrow{font-size:12px;color:var(--muted);margin:0}.link,.logout{color:#087f8c;font-size:13px}.card{background:#fff;border-radius:18px;padding:17px;box-shadow:0 8px 28px #0000000f;margin-bottom:14px}.hidden{display:none!important}.note{color:var(--muted);line-height:1.7;font-size:14px}.demo-note{background:#fff8e8;border:1px solid #f1ddb0}.linebtn{display:block;width:100%;border:0;padding:14px 16px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;text-align:center;text-decoration:none}.badge{background:#e9f4f1;padding:6px 10px;border-radius:999px;font-size:12px}.role-switch{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.role-switch button,.filter{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 11px;border-radius:999px;font-weight:700}.role-switch button.active,.filter.active{background:var(--navy);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;background:#f4f8f7;border-radius:12px}.stat strong{display:block;font-size:22px}.progress-title{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.bar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:#e8eeee}.bar span{height:100%}.want{background:#218c74}.maybe{background:#6bb7a5}.no{background:#97a7ad}.unanswered{background:#d9782d}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 9px}.count,.meta{font-size:13px;color:var(--muted)}.person{background:#fff;border-radius:15px;padding:15px;margin-top:10px;border:1px solid #edf2f1}.person.answered{background:#e7eaeb}.person h3{margin:0;font-size:17px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#edf2f3}.tag.line{background:#dff7e8;color:#08753c}.controls{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;margin-top:10px}.controls strong{font-size:14px}select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--navy);font-weight:700}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-weight:800;color:var(--navy)}.seg button.active{background:var(--navy);color:#fff}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px}.logout{border:0;background:none;text-decoration:underline}.readonly{padding:10px;background:#f4f8f7;border-radius:10px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.user{align-items:flex-start}}
</style></head><body><main class="wrap">
<header class="top"><div><p class="eyebrow">公開デモ・架空100人</p><h1>連絡ダッシュボード</h1></div><a class="link" href="../">公開サイト</a></header>
<section class="card demo-note note">LINE風トーク画面のリッチメニューから遷移するデモです。データは架空で、このブラウザ内だけに保存されます。</section>
<section id="login" class="card"><p class="note">先にLINE風画面でロールを選び、リッチメニューの「メンバーログイン」を押してください。</p><a class="linebtn" href="../line/">LINE風トーク画面へ</a></section>
<div id="dashboard" class="hidden">
<section class="card user"><div><strong id="userName">コンタ さん</strong><div class="meta" id="roleDescription"></div><div class="role-switch" aria-label="デモロール切替"><button data-role="organizer">幹事</button><button data-role="supporter">サポーター</button><button data-role="member">一般</button></div></div><div><span id="roleBadge" class="badge"></span> <button id="logoutBtn" class="logout">ログアウト</button></div></section>
<section class="stats"><div class="stat"><span>全体</span><strong>100</strong></div><div class="stat"><span>1組</span><strong>25</strong></div><div class="stat"><span>2組</span><strong>25</strong></div><div class="stat"><span>3・4組</span><strong>50</strong></div></section>
<section class="card"><div class="progress-title"><span>参加意向</span><small id="total"></small></div><div id="bar" class="bar"></div></section>
<section class="card"><div class="filters"><button class="filter active" data-class="">全クラス</button><button class="filter" data-class="1組">1組</button><button class="filter" data-class="2組">2組</button><button class="filter" data-class="3組">3組</button><button class="filter" data-class="4組">4組</button></div><div id="count" class="count"></div><div id="list"></div></section>
</div></main><div id="toast" class="toast hidden"></div>
<script>
const KEY='atsumare-shimachu-organizer-demo-v2',LOGIN=KEY+'-login',ROLE=KEY+'-role';
const surnames=['モコ','ペンタ','コンタ','ミミ','クルミ','ナギ','ソラ','リン','ポポ','タマ','ルル','ハル','ノア','ココ','ロロ','トト','フウ','マル','ベル','メイ','ララ','テト','ニコ','ピピ','レオ'];
const animals=['リス','ペンギン','キツネ','ウサギ','クマ','ネコ','イルカ','コアラ','ラッコ','パンダ','シカ','フクロウ','カモメ','ヤギ','ヒツジ','カワウソ','ハリネズミ','アザラシ','オオカミ','リャマ','トナカイ','ビーバー','モモンガ','フェネック','カピバラ'];
const schools=['どんぐり小','しおかぜ小','こもれび小'],people=['コンタ','モコ','ペンタ'];
const seed=Array.from({length:100},(_,i)=>({id:'D'+String(i+1).padStart(3,'0'),name:surnames[i%25]+' '+animals[(i+Math.floor(i/25)*7)%25],school:schools[i%3],className:(Math.floor(i/25)+1)+'組',assignee:i%4===0?'':people[i%3],attendance:['未回答','未回答','参加したい','都合が合えば参加したい','今回は欠席予定'][i%5],contact:i%3?'済':'未',line:i%4===0}));
let items=JSON.parse(localStorage.getItem(KEY)||'null')||seed,logged=localStorage.getItem(LOGIN)==='1',role=localStorage.getItem(ROLE)||'member',classFilter='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(items)),toast=m=>{const e=document.querySelector('#toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1200)};
const canEdit=x=>role==='organizer'||(role==='supporter'&&x.assignee==='コンタ');
function renderSummary(){const c={want:0,maybe:0,no:0,unanswered:0};items.forEach(x=>{if(x.attendance==='参加したい')c.want++;else if(x.attendance.startsWith('都合'))c.maybe++;else if(x.attendance.startsWith('今回'))c.no++;else c.unanswered++});document.querySelector('#total').textContent='全100人';document.querySelector('#bar').innerHTML=Object.entries(c).map(([k,v])=>'<span class="'+k+'" style="width:'+v+'%"></span>').join('')}
function render(){const names={organizer:'幹事',supporter:'サポーター',member:'一般メンバー'},desc={organizer:'全100人の管理・ロール管理・監査ログを確認できます',supporter:'自分の担当者だけ更新できます',member:'名簿を閲覧できます（更新不可）'};document.querySelector('#roleBadge').textContent=names[role];document.querySelector('#roleDescription').textContent=desc[role];document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));renderSummary();const out=items.filter(x=>!classFilter||x.className===classFilter);document.querySelector('#count').textContent=out.length+'人を表示';document.querySelector('#list').innerHTML=out.map(x=>'<article class="person '+(x.attendance!=='未回答'?'answered':'')+'"><h3>'+x.name+'</h3><div class="meta">'+x.className+' ／ '+x.school+'</div><div class="tags">'+(x.line?'<span class="tag line">公式LINE友だち</span>':'')+'<span class="tag">'+x.attendance+'</span></div>'+(canEdit(x)?'<div class="controls"><strong>担当</strong><select data-id="'+x.id+'" data-field="assignee"><option value="">未設定</option>'+people.map(v=>'<option '+(x.assignee===v?'selected':'')+'>'+v+'</option>').join('')+'</select><strong>参加状況</strong><select data-id="'+x.id+'" data-field="attendance">'+['未回答','参加したい','都合が合えば参加したい','今回は欠席予定'].map(v=>'<option '+(x.attendance===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>':'<p class="readonly">このロールでは閲覧のみです</p>')+'</article>').join('');document.querySelectorAll('select[data-id]').forEach(e=>e.onchange=()=>{items.find(x=>x.id===e.dataset.id)[e.dataset.field]=e.value;save();render();toast('更新しました')})}
function show(){document.querySelector('#login').classList.toggle('hidden',logged);document.querySelector('#dashboard').classList.toggle('hidden',!logged);if(logged)render()}
document.querySelector('#logoutBtn').onclick=()=>{logged=false;localStorage.removeItem(LOGIN);show()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;localStorage.setItem(ROLE,role);render()});document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{classFilter=b.dataset.class;document.querySelectorAll('[data-class]').forEach(x=>x.classList.toggle('active',x===b));render()});
show();
</script></body></html>

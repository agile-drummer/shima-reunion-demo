<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ再発行｜デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#25352f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0}.top a{color:#39705b}.card{background:#fff;border:1px solid #e4ded1;border-radius:18px;padding:16px;margin-top:14px}.note{color:#6f7b75;font-size:13px;line-height:1.7}.person{display:flex;justify-content:space-between;gap:10px;align-items:center}.person small{display:block;color:#6f7b75;margin-top:4px}.issue{border:0;border-radius:10px;padding:11px 13px;background:#39705b;color:white;font-weight:800}.result{margin-top:12px;padding:12px;border-radius:12px;background:#eff6f2}.result[hidden]{display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actions a,.actions button{padding:10px;border-radius:9px;border:0;text-align:center;text-decoration:none;font-weight:800}.line{background:#06c755;color:white}.copy{background:white;color:#25352f;border:1px solid #e4ded1!important}@media(max-width:480px){.person{align-items:flex-start;flex-direction:column}.issue{width:100%}}</style></head><body><main class="wrap"><header class="top"><h1>マイページ再発行</h1><a href="../">← ダッシュボード</a></header><section class="card note">公開デモです。実在人物・本番token・LINE設定は使いません。30分・1回限りの再発行体験を架空データで再現します。</section><article class="card"><div class="person"><div><strong>モコ リス</strong><small>1組 ／ どんぐり小 ／ 参加したい</small></div><button id="issue" class="issue" type="button">再発行リンクを作る</button></div><div id="result" class="result" hidden></div></article></main><script>const TOKEN='demo-recovery-moko-001',result=document.getElementById('result');document.getElementById('issue').onclick=()=>{const url=new URL('/recover/',location.origin);url.searchParams.set('token',TOKEN);const text='マイページを開くための再発行リンクです。30分・1回限りです。\n'+url;result.hidden=false;result.innerHTML=`<strong>再発行リンクを作成しました</strong><div class="actions"><a id="demo-recovery-line" class="line" href="https://line.me/R/msg/text/?${encodeURIComponent(text)}">LINEで送る</a><button id="demo-recovery-copy" class="copy" type="button">リンクをコピー</button></div><a id="demo-recovery-open" href="${url}">デモではこのリンクを開く</a>`;document.getElementById('demo-recovery-copy').onclick=async()=>{try{await navigator.clipboard.writeText(String(url));document.getElementById('demo-recovery-copy').textContent='コピーしました ✓'}catch{}}};</script></body></html>

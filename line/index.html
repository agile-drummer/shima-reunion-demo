<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式LINEデモ｜あつまれ島中学校</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#222}.phone{max-width:520px;min-height:100vh;margin:auto;background:#8eacc1;position:relative;padding-bottom:210px;box-shadow:0 0 30px #0002}.head{position:sticky;top:0;z-index:2;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd}.back{text-decoration:none;color:#333;font-size:24px}.head strong{display:block}.head small{color:#777}.chat{padding:26px 16px}.day{text-align:center;color:#fff;font-size:11px}.msg{display:flex;gap:9px;align-items:flex-start;margin:22px 0}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:22px}.bubble{max-width:78%;background:#fff;border-radius:4px 16px 16px 16px;padding:12px 14px;line-height:1.65}.bubble h2{font-size:17px;margin:0 0 6px}.role{background:#ffffffd9;border-radius:14px;padding:14px;margin-top:16px}.role label{display:block;margin:9px 0}.menu{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #ccc}.menu-title{padding:8px 12px;font-size:12px;color:#666}.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,82px)}.grid button,.grid a{border:1px solid #e4e4e4;background:#f7fbf4;color:#24422d;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800}.grid span{font-size:23px}.login{background:#dff6d9!important}.toast{position:fixed;left:50%;bottom:220px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;display:none;white-space:nowrap}
</style></head><body><main class="phone"><header class="head"><a class="back" href="../">‹</a><div><strong>あつまれ島中学校</strong><small>公式LINE・デモ</small></div></header><section class="chat"><p class="day">今日</p><div class="msg"><div class="avatar">🏫</div><div class="bubble"><h2>友だち追加ありがとう！</h2>この画面は外部LINEを開かない体験用デモです。下のリッチメニューから、同窓会情報や運営画面を試せます。</div></div><div class="role"><strong>ログインするロールを選択</strong><label><input type="radio" name="role" value="organizer" checked> 幹事（全機能）</label><label><input type="radio" name="role" value="supporter"> サポーター（担当者のみ更新）</label><label><input type="radio" name="role" value="member"> 一般メンバー（閲覧のみ）</label></div></section><div id="toast" class="toast">デモ画面です</div><nav class="menu" aria-label="リッチメニュー"><div class="menu-title">リッチメニュー</div><div class="grid"><a href="../#about"><span>📅</span>開催概要</a><a href="../#interest"><span>✍️</span>参加意向</a><button><span>📰</span>最新情報</button><button><span>🙌</span>お手伝い</button><button><span>💬</span>問い合わせ</button><a id="login" class="login" href="../organizer/"><span>🔐</span>メンバーログイン</a></div></nav></main><script>
const ROLE='atsumare-shimachu-organizer-demo-v2-role',LOGIN='atsumare-shimachu-organizer-demo-v2-login';localStorage.setItem('atsumare-shimachu-line-friend','1');document.querySelectorAll('[name=role]').forEach(r=>r.onchange=()=>localStorage.setItem(ROLE,r.value));localStorage.setItem(ROLE,document.querySelector('[name=role]:checked').value);document.querySelector('#login').onclick=()=>localStorage.setItem(LOGIN,'1');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=document.querySelector('#toast');t.style.display='block';setTimeout(()=>t.style.display='none',1200)});
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページを開く｜デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#25352f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(540px,100%);padding:28px;background:#fff;border:1px solid #e4ded1;border-radius:22px}.kicker{font-size:12px;letter-spacing:.12em;font-weight:800;color:#39705b}h1{margin:0}.lead,.note{color:#6f7b75;line-height:1.8}.safe{padding:14px;border-radius:12px;background:#eff6f2}.button{width:100%;padding:14px;border:0;border-radius:12px;background:#39705b;color:#fff;font:inherit;font-weight:800}.message{min-height:25px;margin-top:12px;color:#39705b;font-weight:700}</style></head><body><main class="wrap"><section class="card"><p class="kicker">MY PAGE RECOVERY DEMO</p><h1>マイページを開く</h1><p class="lead">幹事から届いた再発行リンクを使って、この端末でマイページへ復帰する体験です。</p><p class="safe">🔐 デモでは架空tokenだけを利用します。本番の個人情報や認証情報は使いません。</p><button id="recover" class="button" type="button">自分のマイページを開く</button><p id="message" class="message" role="status"></p><p class="note">本番では30分・1回限りのtokenを利用します。</p></section></main><script>const ANSWER_KEY='atsumare-shimachu-demo',CURRENT_KEY='atsumare-shimachu-demo-current-id',USED_KEY='atsumare-shimachu-demo-recovery-used',token=new URLSearchParams(location.search).get('token')||'',button=document.getElementById('recover'),message=document.getElementById('message');if(token!=='demo-recovery-moko-001'||localStorage.getItem(USED_KEY)===token){button.disabled=true;message.textContent='このリンクは無効、使用済み、または期限切れです。'}button.onclick=()=>{if(button.disabled)return;const rows=JSON.parse(localStorage.getItem(ANSWER_KEY)||'[]').filter(row=>row.id!=='D001');rows.push({id:'D001',intent:'参加したい',at:new Date().toISOString()});localStorage.setItem(ANSWER_KEY,JSON.stringify(rows));localStorage.setItem(CURRENT_KEY,'D001');localStorage.setItem(USED_KEY,token);message.textContent='確認できました。マイページを開きます ✓';setTimeout(()=>location.href='/#my-page',20)};</script></body></html>

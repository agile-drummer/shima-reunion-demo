<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あなた専用の回答ページ｜デモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#25352f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(540px,100%);padding:28px 22px;background:#fff;border:1px solid #e4ded1;border-radius:22px}.kicker{margin:0 0 6px;color:#39705b;font-size:12px;font-weight:800;letter-spacing:.12em}h1{margin:0 0 10px}.lead,.note{color:#6f7b75;line-height:1.8}.safe{padding:14px;border-radius:12px;background:#eff6f2}.button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#39705b;color:#fff;font:inherit;font-weight:800}.message{min-height:25px;margin-top:12px;color:#39705b;font-weight:800}.error{color:#a33c2d}</style></head><body><main class="wrap"><section class="card"><p class="kicker">PERSONAL INVITE DEMO</p><h1>あなた専用の回答ページです</h1><p class="lead">氏名検索をせずに、直接あなたのマイページへ進むデモです。</p><p class="safe">🔐 架空tokenだけを使います。リンクは1回限りです。</p><button id="open" class="button" type="button">自分の回答ページを開く</button><p id="message" class="message" role="status"></p><p class="note">本番ではURLに氏名・名簿ID・クラスを含めません。</p></section></main><script>const INVITE_KEY='atsumare-demo-participant-invite',ANSWER_KEY='atsumare-shimachu-demo',CURRENT_KEY='atsumare-shimachu-demo-current-id',PERSON_ID='demo-invite-moko';const token=new URLSearchParams(location.search).get('token')||'',button=document.getElementById('open'),message=document.getElementById('message');function invite(){try{return JSON.parse(localStorage.getItem(INVITE_KEY)||'null')}catch{return null}}if(!token){button.disabled=true;message.textContent='リンクが正しくありません。';message.classList.add('error')}button.onclick=()=>{const i=invite();if(!i||i.token!==token){message.textContent='リンクを確認できませんでした。';message.classList.add('error');return}if(i.status==='opened'){message.textContent='このリンクは使用済みです。';message.classList.add('error');return}localStorage.setItem(INVITE_KEY,JSON.stringify({...i,status:'opened'}));let rows=[];try{rows=JSON.parse(localStorage.getItem(ANSWER_KEY)||'[]')}catch{}if(!rows.some(row=>row.id===PERSON_ID))rows.push({id:PERSON_ID,intent:'未回答',at:new Date().toISOString()});localStorage.setItem(ANSWER_KEY,JSON.stringify(rows));localStorage.setItem(CURRENT_KEY,PERSON_ID);message.textContent='確認できました。マイページを開きます ✓';location.href='/#my-page'};</script></body></html>
